name: Build Android Widget APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-widget/**'
      - '.github/workflows/build-widget-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing keystore
        env:
          WIDGET_KEYSTORE_B64: ${{ secrets.WIDGET_KEYSTORE_B64 }}
        run: |
          if [ -n "$WIDGET_KEYSTORE_B64" ]; then
            echo "$WIDGET_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cadence-widget.p12"
            echo "WIDGET_KEYSTORE_PATH=$RUNNER_TEMP/cadence-widget.p12" >> "$GITHUB_ENV"
          fi

      - name: Compile and sign Release APK
        env:
          WIDGET_KEY_PASSWORD: ${{ secrets.WIDGET_KEY_PASSWORD }}
          CADENCE_WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          gradle -p android-widget assembleRelease --no-daemon --stacktrace
          cp android-widget/app/build/outputs/apk/release/app-release.apk cadence-widget.apk
          APKSIGNER=$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose cadence-widget.apk
          ls -lh cadence-widget.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadence-widget-apk
          path: cadence-widget.apk

      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view widget-v1 >/dev/null 2>&1; then
            gh release upload widget-v1 cadence-widget.apk --clobber
          else
            gh release create widget-v1 cadence-widget.apk \
              --title "Cadence 2x2 Android Widget" \
              --notes "Signed Android 2x2 home screen widget APK (daily streak, focus minutes today, and target date countdown)." \
              --latest
          fi

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/cadence-widget.p12"
